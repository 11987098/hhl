<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>屏幕共享通话</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app">
        <!-- ===== 登录页 ===== -->
        <div id="login-screen" class="screen active">
            <div class="login-box">
                <h1>📺 屏幕共享通话</h1>
                <p class="subtitle">双方输入相同房间号即可连接</p>
                <input type="text" id="room-input" placeholder="输入房间号（如 1234）" />
                <button id="join-btn">加入房间</button>
                <p class="tip">提示：需在 HTTPS 或 localhost 下使用</p>
            </div>
        </div>

        <!-- ===== 通话页 ===== -->
        <div id="call-screen" class="screen">
            <!-- 远端视频（对方共享的屏幕） -->
            <div class="video-container">
                <video id="remote-video" autoplay playsinline></video>
                <div id="remote-placeholder" class="placeholder">
                    <div class="placeholder-icon">📡</div>
                    <div>等待对方共享屏幕...</div>
                </div>
                <div id="connection-status" class="conn-status">连接中...</div>
            </div>

            <!-- 状态指示 -->
            <div class="status-bar">
                <span id="mic-status" class="status-tag">🎤 麦克风关</span>
                <span id="screen-status" class="status-tag">📺 未共享</span>
                <span id="room-tag" class="status-tag">房间: -</span>
            </div>

            <!-- 控制按钮 -->
            <div class="controls">
                <button id="mic-btn" class="ctrl-btn">🎤 开麦</button>
                <button id="screen-btn" class="ctrl-btn">📺 共享屏幕</button>
                <button id="hangup-btn" class="ctrl-btn danger">📞 挂断</button>
            </div>
        </div>
    </div>

    <!-- SignalR 客户端库 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.0/signalr.min.js"></script>
    <script src="js/app.js"></script>
    <audio id="remote-audio" autoplay playsinline></audio>
</body>
</html>
